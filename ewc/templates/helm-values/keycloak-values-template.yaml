image:
  repository: ${repository}
  tag: ${tag}
  pullPolicy: IfNotPresent


command:
  - "/opt/keycloak/bin/kc.sh"
  - "--verbose"
  - "start"
  - "--http-port=8080"
  - "--hostname-strict=false"
  - "--spi-events-listener-jboss-logging-success-level=info"
  - "--spi-events-listener-jboss-logging-error-level=warn"
  - "--import-realm"

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: ${kc_admin_username}
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: ${kc_admin_secret_name}
        key: ${kc_admin_secret_password_key}
  - name: JAVA_OPTS_APPEND
    value: >-
      -XX:MaxRAMPercentage=50.0
      -Djgroups.dns.query=keycloak-headless
  - name: KC_HOSTNAME_STRICT
    value: "false"

dbchecker:
  enabled: true

database:
  vendor: postgres
  hostname: cnpg-cluster-rw
  port: 5432
  existingSecret: ${db_secret_name}
  existingSecretKey: ${db_secret_password_key}
  existingSecretUserKey: ${db_secret_username_key}

http:
  relativePath: /

service:
  type: ClusterIP
  port: 8080
  annotations: {}

resources:
  requests:
    cpu: "50m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

proxy:
  mode: xforwarded

#livenessProbe: '{"httpGet":{"path":"/health/live","port":"http-internal","scheme":"HTTP"},"initialDelaySeconds":40,"timeoutSeconds":5,"periodSeconds":10}'
#readinessProbe: '{"httpGet":{"path":"/health/ready","port":"http-internal","scheme":"HTTP"},"initialDelaySeconds":40,"timeoutSeconds":2,"periodSeconds":10}'
#startupProbe: '{"httpGet":{"path":"/health/ready","port":"http-internal","scheme":"HTTP"},"initialDelaySeconds":30,"timeoutSeconds":5,"failureThreshold":60,"periodSeconds":5}'
extraInitContainers: |
  - name: custom-keycloak-theme-provider
    image: ${kc_custom_theme_image}:${kc_custom_theme_tag}
    imagePullPolicy: IfNotPresent
    command:
      - sh
    args:
      - -c
      - |
        cp -R /opt/keycloak/themes/* /themes/ 2>/dev/null || true
        cp -R /theme/* /themes/
    volumeMounts:
      - name: themes
        mountPath: /themes
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        cpu: "50m"
        memory: "256Mi"

extraVolumeMounts: |
  - name: config
    mountPath: /opt/keycloak/data/import
    readOnly: true
  - name: themes
    mountPath: /opt/keycloak/themes/

extraVolumes: |
  - name: config
    configMap:
      name: ${kc_realm_configmap_name}
      items:
        - key: realm.json
          path: realm.json
  - name: themes
    emptyDir: {}

ingress:
  enabled: true
  ingressClassName: nginx
  servicePort: http
  annotations:
    cert-manager.io/cluster-issuer: ${cluster_issuer}
    external-dns.alpha.kubernetes.io/hostname: ${hostname}
    external-dns.alpha.kubernetes.io/target: ${ip}
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  labels: {}
  rules:
    - host: ${hostname}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ${hostname}
      secretName: ${hostname}-certificate
